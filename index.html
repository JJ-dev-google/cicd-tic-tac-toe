<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; background-color: #ccc; padding: 5px; border-radius: 10px; }
        .cell { width: 100px; height: 100px; background-color: #fff; border: none; font-size: 2.5rem; font-weight: bold; cursor: pointer; }
        .status { font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="status" id="status">Player X's turn</div>
    <div class="board" id="board">
        <button class="cell" data-index="0"></button><button class="cell" data-index="1"></button><button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button><button class="cell" data-index="4"></button><button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button><button class="cell" data-index="7"></button><button class="cell" data-index="8"></button>
    </div>
    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        boardElement.addEventListener('click', (e) => {
            const index = e.target.getAttribute('data-index');
            if (!index || board[index] !== '') return;
            board[index] = currentPlayer;
            e.target.textContent = currentPlayer;
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusElement.textContent = `Player ${currentPlayer}'s turn`;
        });
    </script>
</body>
</html>
